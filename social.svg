<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 H 0 V 48" fill="none" stroke="#1a2027" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade">
      <stop stop-color="#090b0e"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#fade)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="100" fill="#98a3af" font-size="18" font-weight="600" letter-spacing="3">{{.Heading}}</text>
    <text x="72" y="204" fill="#f4f6f8" font-size="60" font-weight="700" letter-spacing="-2">{{.Name}}</text>
    <text fill="#f4f6f8" font-size="66" font-weight="700" letter-spacing="-2">{{range .TitleLines}}<tspan x="72" y="{{.Y}}">{{.Text}}</tspan>{{end}}</text>
    <text fill="#b6c0ca" font-size="25">{{range .DescriptionLines}}<tspan x="72" y="{{.Y}}">{{.Text}}</tspan>{{end}}</text>
    <path d="M72 490 H1128" stroke="#343d47"/>
    <text x="72" y="548" fill="#98a3af" font-size="20">Computer Engineering · University of Georgia</text>
    <text x="1128" y="548" text-anchor="end" fill="#f4f6f8" font-size="20">mqxs.github.io</text>
  </g>
  <g fill="none" stroke="#343d47" stroke-width="2">
    <rect x="940" y="128" width="144" height="144" rx="20"/>
    <path d="M972 128 V96 H900 M1012 128 V72 M1052 128 V96 H1128 M972 272 V320 H900 M1012 272 V368 M1052 272 V320 H1128 M940 168 H900 M1084 168 H1128 M940 232 H900 M1084 232 H1128"/>
    <rect x="973" y="161" width="78" height="78" rx="8" stroke="#98a3af"/>
  </g>
  <g fill="#98a3af">
    <circle cx="900" cy="96" r="4"/><circle cx="1012" cy="72" r="4"/>
    <circle cx="1128" cy="96" r="4"/><circle cx="900" cy="320" r="4"/>
    <circle cx="1012" cy="368" r="4"/><circle cx="1128" cy="320" r="4"/>
  </g>
</svg>
